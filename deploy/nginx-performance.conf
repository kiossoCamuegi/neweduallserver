# ─────────────────────────────────────────────────────────────────────────
# Performance para o frontend (app.eduall.site) — nginx
#
# Objetivo: internet lenta (3 Mbps). O bundle principal tem ~21 MB; com
# Brotli desce para ~3 MB (vs ~5,5 MB gzip). Aplicar no server/location
# que serve /static.
#
# Requer o módulo ngx_brotli para a parte de Brotli. Se não existir, o
# gzip continua a funcionar.
# ─────────────────────────────────────────────────────────────────────────

# 1) Brotli (melhor que gzip para JS/CSS)
brotli              on;
brotli_comp_level   6;
brotli_static       on;   # serve ficheiros .br pré-comprimidos, se existirem
brotli_min_length   1024;
brotli_types
  text/plain text/css text/xml
  application/javascript application/json application/xml
  image/svg+xml font/ttf font/otf;

# 2) gzip como fallback
gzip                on;
gzip_comp_level     6;
gzip_static         on;   # serve ficheiros .gz pré-comprimidos, se existirem
gzip_min_length     1024;
gzip_vary           on;
gzip_types
  text/plain text/css text/xml
  application/javascript application/json application/xml
  image/svg+xml font/ttf font/otf;

# 3) Cache dos assets com hash (main.<hash>.js, chunks, css, fontes, media)
location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|avif|ico|woff2?|ttf|otf|mp4|webm)$ {
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable";
  access_log off;
  try_files $uri =404;
}

# 4) HTML e config nunca devem ficar presos em cache
location = /index.html {
  add_header Cache-Control "no-cache, no-store, must-revalidate";
}
location = /config.json {
  add_header Cache-Control "no-cache, no-store, must-revalidate";
}
# O manifest também muda a cada build
location = /asset-manifest.json {
  add_header Cache-Control "no-cache, no-store, must-revalidate";
}
